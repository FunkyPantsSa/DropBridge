# Build the Windows radio backend on GitHub Actions.
#
# Why this exists: the local test machine has no MSVC/CMake/Windows SDK, so
# `airbridge_radio.exe` can only be compiled on a machine with the VS C++
# workload. This workflow reproduces the documented radio-only path
# (docs/BUILD_WINDOWS.md §8): pinned devourer checkout -> vcpkg libusb+pkgconf
# -> Build-UsbProbe.ps1 -> Build-Radio.ps1 (which also runs the two offline
# CTest regressions).
#
# It does NOT touch hardware, does not sign anything and does not package a
# release; it only produces the exes to download as an artifact.
name: build-radio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/radio_usb/**'
      - 'tools/usb_probe/**'
      - 'tools/Build-Radio.ps1'
      - 'tools/Build-UsbProbe.ps1'
      - 'tools/Prepare-Devourer.ps1'
      - 'tools/Setup-BuildDeps.ps1'
      - 'patches/devourer-airbridge.patch'
      - 'docs/sources.lock.json'
      - '.github/workflows/build-radio.yml'
  pull_request:
    paths:
      - 'src/radio_usb/**'
      - 'tools/usb_probe/**'
      - 'tools/Build-Radio.ps1'
      - 'tools/Build-UsbProbe.ps1'
      - 'tools/Prepare-Devourer.ps1'
      - 'tools/Setup-BuildDeps.ps1'
      - 'patches/devourer-airbridge.patch'
      - 'docs/sources.lock.json'
      - '.github/workflows/build-radio.yml'

permissions:
  # contents:write so the publish step can create/update the ci-latest
  # prerelease. Pull requests from forks still get a read-only token.
  contents: write

concurrency:
  group: build-radio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radio:
    name: radio + usb_probe (MSVC x64, pinned devourer)
    # windows-latest moved to windows-2025 + Visual Studio 2026, where a pinned
    # "Visual Studio 17 2022" generator fails with "could not find any instance
    # of Visual Studio" (CMake only learned the VS 18 2026 generator in 4.2).
    # windows-2022 still ships VS 2022, which is what the project targets.
    # The build scripts no longer hard-code the generator, so switching this to
    # windows-latest later only needs a CMake >= 4.2 on the image.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The scripts pick the generator from vswhere: VS 17 is used when it is
      # installed, otherwise CMake's default (newest VS). Print both so a future
      # image change is visible in the log instead of a bare CMake error.
      - name: Toolchain and Visual Studio
        shell: powershell
        run: |
          cmake --version | Select-Object -First 1
          git --version
          Write-Host "runner: $env:RUNNER_OS $env:RUNNER_IMAGE"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            Write-Host '--- Visual Studio installations (>= VS 17 with C++) ---'
            & $vswhere -all -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            & $vswhere -all -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationVersion
          } else {
            Write-Host 'vswhere not found'
          }
          Write-Host '--- CMake Visual Studio generators ---'
          cmake --help | Select-String 'Visual Studio \d+ \d+' | ForEach-Object { $_.Line.Trim() }

      # upstream/ is git-ignored, so the runner has to restore the locked
      # devourer commit itself. Fetching that exact SHA works on GitHub even
      # though it is not a branch tip; Prepare-Devourer.ps1 then makes the
      # patched build copy under build/devourer-airbridge.
      - name: Restore pinned devourer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content docs\sources.lock.json -Raw | ConvertFrom-Json
          $dep = $lock | Where-Object { $_.name -eq 'devourer' }
          if (-not $dep) { throw 'devourer entry missing from docs/sources.lock.json' }
          Write-Host "devourer: $($dep.url) @ $($dep.commit)"
          New-Item -ItemType Directory -Force upstream | Out-Null
          git init -q upstream\devourer
          git -C upstream\devourer remote add origin $dep.url
          git -C upstream\devourer -c core.autocrlf=false fetch --depth 1 origin $dep.commit
          if ($LASTEXITCODE -ne 0) { throw "git fetch $($dep.commit) failed" }
          git -C upstream\devourer update-ref refs/heads/pinned FETCH_HEAD
          $head = (git -C upstream\devourer rev-parse refs/heads/pinned).Trim()
          if ($head -ne $dep.commit) { throw "unexpected devourer head: $head" }
          Write-Host "devourer pinned at $head"

      - name: Install build dependencies (vcpkg libusb + pkgconf)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\Setup-BuildDeps.ps1

      - name: Build usb_probe (read-only probe)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\Build-UsbProbe.ps1

      - name: Build radio + offline CTest regressions
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\Build-Radio.ps1

      # A failed configure says little on the console; CMake's own detection
      # log is the thing that names the missing compiler/SDK.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            evidence/usb-probe-configure.log
            evidence/usb-probe-build.log
            build/radio_usb/CMakeFiles/CMakeConfigureLog.yaml

      - name: Hashes
        shell: powershell
        run: |
          Get-ChildItem build\radio_usb\Release\*.exe, build\usb_probe\Release\*.exe -ErrorAction SilentlyContinue |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              Write-Host ('{0}  {1,9}  {2}' -f $hash, $_.Length, $_.Name)
            }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dropbridge-radio-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/radio_usb/Release/airbridge_radio.exe
            build/radio_usb/Release/radio_pipe_bridge.exe
            build/radio_usb/Release/peer_telemetry_test.exe
            build/radio_usb/Release/channel_completion_test.exe
            build/usb_probe/Release/usb_probe.exe
            build/usb_probe/Release/libusb-1.0.dll

      # Artifact downloads need a GitHub login even on a public repo. The
      # rolling prerelease gives the hardware test machine an anonymous URL:
      #   https://github.com/FunkyPantsSa/DropBridge/releases/download/ci-latest/<file>
      # It is a build output, not a product release; the source is this repo
      # plus the pinned devourer commit and patches/devourer-airbridge.patch.
      - name: Publish ci-latest prerelease (public download)
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'ci-latest'
          $files = @(
            'build\radio_usb\Release\airbridge_radio.exe',
            'build\radio_usb\Release\radio_pipe_bridge.exe',
            'build\radio_usb\Release\peer_telemetry_test.exe',
            'build\radio_usb\Release\channel_completion_test.exe',
            'build\usb_probe\Release\usb_probe.exe',
            'build\usb_probe\Release\libusb-1.0.dll'
          )
          $notes = "Automated build of $env:GITHUB_SHA by build-radio. CI test binaries only: not a product release, no signing. Source: this repository + devourer at the commit pinned in docs/sources.lock.json + patches/devourer-airbridge.patch."
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title 'CI test build (radio)' --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          } else {
            gh release edit $tag --notes $notes
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          Write-Host 'published ci-latest'
